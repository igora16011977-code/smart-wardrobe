<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f1">
  <title>Моя шафа</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:light;--bg:#f7f5f1;--card:#fff;--ink:#242321;--muted:#85817b;--line:#e9e5de;--accent:#5e715b;--accent-soft:#e8eee5;--danger:#b53b2e;--danger-soft:#fff0ed;--radius:20px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
    button,input,textarea,select{font:inherit}.page{width:min(100%,760px);margin:0 auto;padding:22px 16px 0}header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
    .eyebrow{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}h1{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.04em;font-weight:750}.header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}.count{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:650}.refresh-btn{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:750;white-space:nowrap;cursor:pointer}.refresh-btn:disabled{opacity:.6;cursor:wait}
    .intro{color:var(--muted);font-size:14px;line-height:1.45;margin:9px 0 0}.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
    .filter{border:1px solid var(--line);background:var(--card);color:#5d5953;border-radius:999px;padding:10px 15px;white-space:nowrap;font-size:13px;font-weight:650;cursor:pointer}.filter.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .status{display:none;padding:13px 15px;margin:4px 0 16px;border-radius:14px;background:#fff;color:#625e58;font-size:14px;line-height:1.45;border:1px solid var(--line)}.status.show{display:block}.status.error{background:#fff1ef;border-color:#f1d2cc;color:#8b3529}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{min-width:0;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:transform .15s,box-shadow .15s}.item:active{transform:scale(.985)}
    .photo-wrap{aspect-ratio:4/5;background:#eeece7;position:relative;overflow:hidden}.photo{width:100%;height:100%;object-fit:cover;display:block}.photo-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#aaa49a;font-size:34px}
    .item-info{padding:12px 12px 14px}.category{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:750;margin:0 0 5px}.description{font-size:13px;line-height:1.4;margin:0;overflow-wrap:anywhere}
    .empty{grid-column:1/-1;text-align:center;padding:44px 20px;background:#fff;border:1px dashed #d9d3c9;border-radius:var(--radius)}.empty-icon{font-size:38px;margin-bottom:10px}.empty h2{font-size:17px;margin:0 0 7px}.empty p{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
    .spinner{width:22px;height:22px;border:2px solid #d9ded6;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.footer{color:#a19b91;font-size:11px;text-align:center;padding:22px 0 4px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(28,27,25,.48);z-index:20;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal-backdrop.open{display:flex}.modal{background:var(--bg);width:min(100%,560px);max-height:94dvh;overflow:auto;border-radius:26px 26px 20px 20px;box-shadow:0 18px 60px rgba(0,0,0,.2);padding:14px 16px calc(16px + env(safe-area-inset-bottom));animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(18px);opacity:.7}to{transform:translateY(0);opacity:1}}
    .modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.modal-heading{font-size:19px;font-weight:750;margin:0}.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);font-size:20px;cursor:pointer}
    .detail-photo{width:100%;max-height:48dvh;aspect-ratio:4/3;object-fit:contain;background:#eeece7;border-radius:18px;display:block}.detail-title{font-size:24px;line-height:1.2;margin:15px 0 7px}.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
    .details{margin:14px 0 18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 14px}.detail-row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.detail-row:last-child{border:0}.detail-row strong{font-weight:650}.detail-row span{color:#625e58;text-align:right;overflow-wrap:anywhere}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{border:0;border-radius:15px;padding:13px 12px;font-weight:700;cursor:pointer}.action.primary{background:var(--accent);color:#fff}.action.danger{background:var(--danger-soft);color:var(--danger)}.action.secondary{background:#fff;border:1px solid var(--line);color:#625e58}
    .form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid #ded9d1;border-radius:13px;background:#fff;padding:12px 13px;color:var(--ink);outline:none}.field textarea{min-height:86px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.form-error{display:none;color:var(--danger);font-size:13px;line-height:1.4}.form-error.show{display:block}
    @media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.page{padding:30px 22px 0}.modal-backdrop{align-items:center}.modal{border-radius:24px}}
  </style>
</head>
<body>
  <main class="page">
    <header><div><p class="eyebrow">Шо одіти? · smart wardrobe</p><h1>Моя шафа</h1><p class="intro">Усі твої речі — в одному зручному місці.</p></div><div class="header-actions"><button class="refresh-btn" id="refreshAll" type="button">🔄 ОНОВИТИ</button><div class="count" id="count">0 речей</div></div></header>
    <nav class="filters" aria-label="Категорії гардероба">
      <button class="filter active" data-category="все">Усе</button><button class="filter" data-category="верх">Верх</button><button class="filter" data-category="низ">Низ</button><button class="filter" data-category="взуття">Взуття</button><button class="filter" data-category="аксесуари">Аксесуари</button>
    </nav>
    <div class="status show" id="status"><span class="spinner"></span>Завантажую гардероб…</div>
    <section class="grid" id="grid" aria-live="polite"></section><div class="footer">Твій гардероб завжди під рукою</div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalHeading">
      <div class="modal-top"><h2 class="modal-heading" id="modalHeading">Картка речі</h2><button class="icon-btn" id="closeModal" aria-label="Закрити">×</button></div>
      <div id="modalContent"></div>
    </section>
  </div>

  <script>
    const API_BASE = "https://smart-wardrobe-q5fg.onrender.com";
    const tg = window.Telegram?.WebApp;
    const grid = document.getElementById("grid"), statusBox = document.getElementById("status"), countBox = document.getElementById("count");
    const filterButtons = [...document.querySelectorAll(".filter")];
    const refreshButton = document.getElementById("refreshAll");
    const backdrop = document.getElementById("modalBackdrop"), modalContent = document.getElementById("modalContent"), modalHeading = document.getElementById("modalHeading");
    let currentCategory = "все", itemsCache = [], photoObjectUrls = new Map(), activeItem = null;
    if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#f7f5f1"); tg.setBackgroundColor("#f7f5f1"); } catch (_) {} }

    function authHeaders(json=false) { const h = {"Authorization": `tma ${tg?.initData || ""}`}; if(json) h["Content-Type"]="application/json"; return h; }
    function showStatus(message,isError=false){statusBox.className="status show"+(isError?" error":"");statusBox.textContent=message;}
    function hideStatus(){statusBox.className="status";}
    function revokeImages(){for(const url of photoObjectUrls.values())URL.revokeObjectURL(url);photoObjectUrls.clear();}
    function pluralItems(n){const a=n%10,b=n%100;if(a===1&&b!==11)return`${n} річ`;if(a>=2&&a<=4&&(b<12||b>14))return`${n} речі`;return`${n} речей`;}
    function categoryLabel(v){return({верх:"Верх",низ:"Низ",взуття:"Взуття",аксесуари:"Аксесуари"})[v]||v||"Річ";}
    function safeText(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=text||"";return el;}
    async function loadPhoto(item){if(photoObjectUrls.has(item.id))return photoObjectUrls.get(item.id);const r=await fetch(`${API_BASE}${item.photo_url}`,{headers:authHeaders()});if(!r.ok)throw new Error(`HTTP ${r.status}`);const blob=await r.blob();if(!blob.size)throw new Error("Порожнє фото");const url=URL.createObjectURL(blob);photoObjectUrls.set(item.id,url);return url;}
    function showCardPhoto(itemId,url){
      const card=grid.querySelector(`[data-item-id="${CSS.escape(String(itemId))}"]`);
      if(!card)return;
      const img=card.querySelector(".photo"),placeholder=card.querySelector(".photo-placeholder");
      if(!img||!placeholder)return;
      img.onload=()=>{placeholder.style.display="none";img.style.display="block";};
      img.onerror=()=>{img.style.display="none";placeholder.style.display="grid";};
      img.src=url;
    }
    async function renderItems(items){revokeImages();grid.replaceChildren();countBox.textContent=pluralItems(items.length);
      if(!items.length){const empty=document.createElement("div");empty.className="empty";empty.innerHTML='<div class="empty-icon">🧺</div><h2>Тут поки порожньо</h2><p>У цій категорії ще немає речей. Додай фото через Telegram-бота — і вони з’являться тут.</p>';grid.appendChild(empty);return;}
      for(const item of items){const card=document.createElement("article");card.className="item";card.dataset.itemId=String(item.id);card.tabIndex=0;card.setAttribute("role","button");card.setAttribute("aria-label",`Відкрити ${item.title||item.description||"річ"}`);
        const wrap=document.createElement("div");wrap.className="photo-wrap";const placeholder=safeText("div","photo-placeholder","👕");const img=document.createElement("img");img.className="photo";img.alt=item.title||item.description||"Річ із гардероба";img.style.display="none";wrap.append(placeholder,img);
        const info=document.createElement("div");info.className="item-info";info.append(safeText("p","category",categoryLabel(item.category)),safeText("p","description",item.title||item.description||"Без назви"));card.append(wrap,info);
        const open=()=>openDetails(item);card.addEventListener("click",open);card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});grid.appendChild(card);
        loadPhoto(item).then(url=>{img.onload=()=>{placeholder.style.display="none";img.style.display="block";};img.src=url;}).catch(()=>{placeholder.textContent="Фото недоступне";placeholder.style.fontSize="12px";});
      }
    }
    async function loadWardrobe(){if(!tg||!tg.initData){countBox.textContent="—";showStatus("Відкрий цю сторінку з кнопки вебшафи всередині Telegram, щоб підтвердити доступ до свого гардероба.",true);return;}
      showStatus("Завантажую гардероб…");try{const r=await fetch(`${API_BASE}/api/wardrobe?category=${encodeURIComponent(currentCategory)}`,{headers:authHeaders()});const data=await r.json();if(!r.ok){if(r.status===401)throw new Error("Не вдалося підтвердити Telegram-сесію. Закрий вебшафу та відкрий її знову через бота.");throw new Error(data.error||"Помилка завантаження гардероба.");}itemsCache=data.items||[];hideStatus();await renderItems(itemsCache);}catch(e){countBox.textContent="—";showStatus(e.message||"Не вдалося завантажити гардероб.",true);}}
    function updateVisibleCard(item){
      const index=itemsCache.findIndex(x=>String(x.id)===String(item.id));
      if(index!==-1)itemsCache[index]={...itemsCache[index],...item};
      const card=grid.querySelector(`[data-item-id="${CSS.escape(String(item.id))}"]`);
      const belongsToFilter=currentCategory==="все"||item.category===currentCategory;
      if(!belongsToFilter){
        if(index!==-1)itemsCache.splice(index,1);
        card?.remove();
        if(photoObjectUrls.has(item.id)){URL.revokeObjectURL(photoObjectUrls.get(item.id));photoObjectUrls.delete(item.id);}
      }else if(card){
        const category=card.querySelector(".category"),description=card.querySelector(".description"),img=card.querySelector(".photo");
        if(category)category.textContent=categoryLabel(item.category);
        if(description)description.textContent=item.title||item.description||"Без назви";
        if(img)img.alt=item.title||item.description||"Річ із гардероба";
        card.setAttribute("aria-label",`Відкрити ${item.title||item.description||"річ"}`);
      }
      countBox.textContent=pluralItems(itemsCache.length);
      if(!itemsCache.length)renderItems([]);
    }
    function removeVisibleCard(item){
      itemsCache=itemsCache.filter(x=>String(x.id)!==String(item.id));
      grid.querySelector(`[data-item-id="${CSS.escape(String(item.id))}"]`)?.remove();
      if(photoObjectUrls.has(item.id)){URL.revokeObjectURL(photoObjectUrls.get(item.id));photoObjectUrls.delete(item.id);}
      countBox.textContent=pluralItems(itemsCache.length);
      if(!itemsCache.length)renderItems([]);
    }
    function openModal(title){modalHeading.textContent=title;backdrop.classList.add("open");backdrop.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";}
    function closeModal(){backdrop.classList.remove("open");backdrop.setAttribute("aria-hidden","true");document.body.style.overflow="";activeItem=null;}
    document.getElementById("closeModal").addEventListener("click",closeModal);backdrop.addEventListener("click",e=>{if(e.target===backdrop)closeModal();});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&backdrop.classList.contains("open"))closeModal();});
    function detailRow(label,value){const row=safeText("div","detail-row","");row.append(safeText("strong","",label),safeText("span","",value||"Не вказано"));return row;}
    async function openDetails(item){activeItem=item;openModal("Картка речі");modalContent.replaceChildren();const loading=safeText("p","", "Завантажую фотографію…");modalContent.append(loading);
      const img=document.createElement("img");img.className="detail-photo";img.alt=item.title||"Фото речі";try{const photoUrl=await loadPhoto(item);img.src=photoUrl;showCardPhoto(item.id,photoUrl);}catch(_){img.alt="Фото недоступне";img.style.display="none";}
      if(activeItem?.id!==item.id)return;modalContent.replaceChildren();modalContent.append(img,safeText("h3","detail-title",item.title||item.description||"Без назви"),safeText("span","pill",categoryLabel(item.category)));
      const details=document.createElement("div");details.className="details";details.append(detailRow("Опис",item.description),detailRow("Колір",item.color),detailRow("Матеріал",item.material),detailRow("Фасон",item.style));modalContent.append(details);
      const actions=document.createElement("div");actions.className="actions";const edit=safeText("button","action primary","✎  Редагувати"),del=safeText("button","action danger","♧  Видалити");edit.type=del.type="button";edit.addEventListener("click",()=>openEdit(item));del.addEventListener("click",()=>deleteItem(item));actions.append(edit,del);modalContent.append(actions);
    }
    function openEdit(item){activeItem=item;openModal("Редагування речі");modalContent.replaceChildren();const form=document.createElement("form");form.className="form";
      const fields=[
        ["Назва","title",item.title||item.description||"","text"],
        ["Опис речі","description",item.description||"","textarea"],
        ["Категорія","category",item.category||"верх","select"],
        ["Колір","color",item.color||"","text"],
        ["Матеріал","material",item.material||"","text"],
        ["Фасон","style",item.style||"","text"]
      ];const controls={};
      for(const [label,name,value,type] of fields){const wrap=document.createElement("div");wrap.className="field";wrap.append(safeText("label","",label));let control;
        if(type==="textarea"){control=document.createElement("textarea");control.rows=3;}else if(type==="select"){control=document.createElement("select");for(const [v,t] of [["верх","Верх"],["низ","Низ"],["взуття","Взуття"],["аксесуари","Аксесуари"]]){const opt=document.createElement("option");opt.value=v;opt.textContent=t;control.append(opt);}}else{control=document.createElement("input");control.type="text";}
        control.name=name;control.value=value;control.required=["title","description","category"].includes(name);wrap.append(control);form.append(wrap);controls[name]=control;
      }
      const error=safeText("div","form-error","");form.append(error);const buttons=document.createElement("div");buttons.className="form-actions";const cancel=safeText("button","action secondary","Скасувати"),save=safeText("button","action primary","✓  Зберегти");cancel.type="button";save.type="submit";cancel.addEventListener("click",()=>openDetails(item));buttons.append(cancel,save);form.append(buttons);
      form.addEventListener("submit",async e=>{e.preventDefault();error.classList.remove("show");save.disabled=true;save.textContent="Зберігаю…";const payload={};for(const key of Object.keys(controls))payload[key]=controls[key].value.trim();try{const r=await fetch(`${API_BASE}/api/wardrobe/${item.id}`,{method:"PUT",headers:authHeaders(true),body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw new Error(data.error||"Не вдалося зберегти зміни.");const updatedItem={...item,...payload};closeModal();updateVisibleCard(updatedItem);}catch(err){error.textContent=err.message;error.classList.add("show");}finally{save.disabled=false;save.textContent="✓  Зберегти";}});modalContent.append(form);
    }
    async function refreshAllWardrobe(){
      if(refreshButton.disabled)return;
      refreshButton.disabled=true;refreshButton.textContent="⏳ ОНОВЛЕННЯ…";
      showStatus("Оновлюю гардероб…");
      try{
        const r=await fetch(`${API_BASE}/api/wardrobe/refresh`,{method:"POST",headers:authHeaders()});
        let data={};try{data=await r.json();}catch(_){}
        if(!r.ok)throw new Error(data.message||"Не вдалося оновити гардероб.");
        await loadWardrobe();
        if(data.partial_failure){
          showStatus("Не всі речі вдалося оновити. Перевір з’єднання та спробуй ще раз.",true);
        }else{
          showStatus("Гардероб оновлено!");
          setTimeout(()=>{if(statusBox.textContent==="Гардероб оновлено!")hideStatus();},3000);
        }
      }catch(e){
        const offline=!navigator.onLine||e instanceof TypeError;
        showStatus(offline?"Немає з’єднання. Перевір інтернет і спробуй ще раз.":"Не вдалося оновити гардероб. Спробуй пізніше.",true);
      }finally{refreshButton.disabled=false;refreshButton.textContent="🔄 ОНОВИТИ";}
    }
    refreshButton.addEventListener("click",refreshAllWardrobe);

    function askConfirm(message){return new Promise(resolve=>{if(tg?.showConfirm){tg.showConfirm(message,resolve);}else resolve(window.confirm(message));});}
    async function deleteItem(item){const yes=await askConfirm("Видалити цю річ із гардероба? Цю дію не можна скасувати.");if(!yes)return;try{const r=await fetch(`${API_BASE}/api/wardrobe/${item.id}`,{method:"DELETE",headers:authHeaders()});const data=await r.json();if(!r.ok)throw new Error(data.error||"Не вдалося видалити річ.");closeModal();removeVisibleCard(item);}catch(e){if(tg?.showAlert)tg.showAlert(e.message);else alert(e.message);}}
    filterButtons.forEach(button=>button.addEventListener("click",()=>{if(button.dataset.category===currentCategory)return;currentCategory=button.dataset.category;filterButtons.forEach(b=>b.classList.toggle("active",b===button));loadWardrobe();}));
    loadWardrobe();
  </script>
</body>
</html>
